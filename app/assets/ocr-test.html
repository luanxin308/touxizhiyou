<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>OCR 自测</title>
<style>
  body { font: 13px/1.5 Consolas, monospace; background: #111; color: #ddd; padding: 12px; }
  table { border-collapse: collapse; margin-top: 10px; }
  td, th { border: 1px solid #333; padding: 4px 8px; }
  .ok { color: #5f5; }
  .bad { color: #f66; }
  canvas { border: 1px solid #333; vertical-align: middle; }
</style>
</head>
<body>
<h3>数码管识别自测</h3>
<pre id="out">running...</pre>
<div id="stage"></div>
<script src="js/ocr.js"></script>
<script>
(function () {
  var SEG = {
    '0': 'abcdef', '1': 'bc', '2': 'abged', '3': 'abgcd', '4': 'fgbc',
    '5': 'afgcd', '6': 'afgecd', '7': 'abc', '8': 'abcdefg', '9': 'abcdfg'
  };

  function drawDigit(c, x, y, w, h, t, ch) {
    var on = SEG[ch] || '';
    function seg(id) { return on.indexOf(id) >= 0; }
    function box(bx, by, bw, bh) {
      if (bw > 0 && bh > 0) { c.fillRect(bx, by, bw, bh); }
    }
    var half = h / 2;
    if (seg('a')) { box(x + t, y, w - 2 * t, t); }
    if (seg('f')) { box(x, y + t, t, half - 1.5 * t); }
    if (seg('b')) { box(x + w - t, y + t, t, half - 1.5 * t); }
    if (seg('g')) { box(x + t, y + half - t / 2, w - 2 * t, t); }
    if (seg('e')) { box(x, y + half + t / 2, t, half - 1.5 * t); }
    if (seg('c')) { box(x + w - t, y + half + t / 2, t, half - 1.5 * t); }
    if (seg('d')) { box(x + t, y + h - t, w - 2 * t, t); }
  }

  // 画一整行数字（支持小数点），返回 canvas
  function render(text, dh, opts) {
    opts = opts || {};
    var dark = opts.dark !== false;
    var padX = 14, padY = 10;
    var t = Math.max(3, Math.round(dh * 0.16));
    var dw = Math.round(dh * 0.58);
    var gap = Math.round(dw * 0.34);
    var total = 0;
    for (var i = 0; i < text.length; i++) {
      total += (text[i] === '.' ? Math.round(dw * 0.35) : dw) + gap;
    }
    total = total - gap + padX * 2;

    var cv = document.createElement('canvas');
    cv.width = total;
    cv.height = dh + padY * 2;
    var c = cv.getContext('2d');
    c.fillStyle = dark ? '#14261A' : '#F4EFE3';
    c.fillRect(0, 0, cv.width, cv.height);
    if (opts.blur) { c.filter = 'blur(' + opts.blur + 'px)'; }
    c.fillStyle = dark ? '#6BE08A' : '#1A1A1A';
    // 轻微发光，模拟真实屏幕
    if (dark) { c.shadowColor = '#6BE08A'; c.shadowBlur = dh * 0.08; }

    var cx = padX;
    for (i = 0; i < text.length; i++) {
      var ch = text[i];
      if (ch === '.') {
        c.beginPath();
        c.arc(cx + dw * 0.1, dh + padY - t, t * 0.9, 0, Math.PI * 2);
        c.fill();
        cx += Math.round(dw * 0.35) + gap;
      } else {
        drawDigit(c, cx, padY, dw, dh, t, ch);
        cx += dw + gap;
      }
    }
    if (opts.noise) {
      c.filter = 'none';
      var id = c.getImageData(0, 0, cv.width, cv.height);
      var dd = id.data;
      for (var p = 0; p < dd.length; p += 4) {
        if (Math.random() < opts.noise) {
          var v = Math.random() * 255;
          dd[p] = v; dd[p + 1] = v; dd[p + 2] = v;
        }
      }
      c.putImageData(id, 0, 0);
    }
    return cv;
  }

  var CASES = [
    { t: '100.0', h: 64, dark: true },
    { t: '100.0', h: 96, dark: true },
    { t: '98.0', h: 64, dark: true },
    { t: '86.5', h: 80, dark: true },
    { t: '152', h: 64, dark: true },
    { t: '88', h: 64, dark: true },
    { t: '76', h: 64, dark: true },
    { t: '100.0', h: 40, dark: true },
    { t: '120', h: 50, dark: true },
    { t: '80', h: 50, dark: true },
    { t: '100.0', h: 64, dark: false },
    { t: '138', h: 72, dark: false },
    { t: '0.0', h: 64, dark: true },
    { t: '100.0', h: 64, dark: true, blur: 1 },
    { t: '98.5', h: 64, dark: true, noise: 0.12 },
    { t: '152', h: 56, dark: true, blur: 0.8 },
    { t: '66.4', h: 88, dark: true, noise: 0.06 }
  ];

  var stage = document.getElementById('stage');
  var lines = [];
  var pass = 0;

  for (var i = 0; i < CASES.length; i++) {
    var cs = CASES[i];
    var cv = render(cs.t, cs.h, { dark: cs.dark });
    stage.appendChild(cv);
    stage.appendChild(document.createElement('br'));
    var r;
    try {
      r = window.OCR.recognize(cv, 720);
    } catch (e) {
      r = { ok: false, text: '', lines: [] };
      lines.push('EXC ' + cs.t + ' -> ' + e.message);
    }
    var got = (r.lines && r.lines.length) ? r.lines[0].text : '';
    var ok = (got === cs.t);
    if (ok) { pass++; }
    lines.push((ok ? 'PASS ' : 'FAIL ') + 'expect=' + cs.t + ' got=' + got +
      ' h=' + cs.h + ' dark=' + cs.dark + ' ok=' + r.ok);
    if (!ok && r.lines && r.lines[0]) {
      var det = [];
      for (var q = 0; q < r.lines[0].chars.length; q++) {
        var cc = r.lines[0].chars[q];
        det.push(cc.ch + '(m=' + (cc.mask === undefined ? '-' : cc.mask) +
          ',w=' + (cc.box.x1 - cc.box.x0 + 1) + ',h=' + (cc.box.y1 - cc.box.y0 + 1) + ')');
      }
      lines.push('     ' + det.join(' ') + ' | th=' + Math.round(r.th) + ' inv=' + r.invert +
        ' band=' + r.lines[0].y0 + '-' + r.lines[0].y1 + ' H=' + (r.size ? r.size.h : '?'));
    }
  }

  var summary = 'RESULT ' + pass + '/' + CASES.length + '\n' + lines.join('\n');

  // ---- 多行（血压计三行） ----
  function stackRows(texts, dh, opts) {
    var cvs = [];
    for (var i = 0; i < texts.length; i++) { cvs.push(render(texts[i], dh, opts)); }
    var w = 0, h = 0, j;
    for (j = 0; j < cvs.length; j++) {
      if (cvs[j].width > w) { w = cvs[j].width; }
      h += cvs[j].height;
    }
    var out = document.createElement('canvas');
    out.width = w;
    out.height = h;
    var c = out.getContext('2d');
    c.fillStyle = '#14261A';
    c.fillRect(0, 0, w, h);
    var y = 0;
    for (j = 0; j < cvs.length; j++) {
      c.drawImage(cvs[j], 0, y);
      y += cvs[j].height;
    }
    return out;
  }

  var multiCv = stackRows(['152', '88', '76'], 48, { dark: true });
  stage.appendChild(multiCv);
  var mr = window.OCR.recognize(multiCv, 760);
  var mtexts = [];
  for (var mi = 0; mi < (mr.lines || []).length; mi++) { mtexts.push(mr.lines[mi].text); }
  var mok = (mtexts.length === 3 && mtexts[0] === '152' && mtexts[1] === '88' && mtexts[2] === '76');
  summary += '\nMULTI ' + (mok ? 'PASS' : 'FAIL') + ' expect=152|88|76 got=' + mtexts.join('|') +
    ' (rows=' + (mr.lines || []).length + ')';

  document.getElementById('out').textContent = summary;
  document.title = 'RESULT ' + pass + '/' + CASES.length;
})();
</script>
</body>
</html>
